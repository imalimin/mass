# Copy to mass.yaml; provide the named environment values. D04 needs MariaDB/TOS; runtime uses space model credentials.
# /health/ready checks the schema and TOS bucket with bounded caching.
http:
  listen: "127.0.0.1:8080"
  public_url: "http://127.0.0.1:8080"
  shutdown_timeout: "10s"
database:
  dsn_env: "MASS_MARIADB_DSN" # Application account: SELECT/INSERT/UPDATE/DELETE only.
  migration_dsn_env: "MASS_MARIADB_MIGRATION_DSN" # DDL account; only mass migrate uses it.
tos:
  endpoint_env: "MASS_TOS_ENDPOINT"
  region_env: "MASS_TOS_REGION"
  bucket_env: "MASS_TOS_BUCKET"
  prefix: "mass/"
  access_key_env: "MASS_TOS_ACCESS_KEY"
  secret_key_env: "MASS_TOS_SECRET_KEY"
storage: # Optional for existing D02 configs; these are the defaults.
  max_object_bytes: 268435456
  max_file_bytes: 33554432
  max_workspace_bytes: 134217728
  max_entries: 10000
auth:
  session_ttl: "24h"
  cookie_secure: false # Loopback development only; HTTPS deployments use true.
llm:
  framework: "eino"
  provider: "ark"
  base_url_env: "MASS_LLM_MODEL_BASE_URL" # Approved compatible endpoint; old configs without this field use Ark.
  model_env: "MASS_LLM_MODEL_ID" # Used only by explicit real-model smoke tests.
  api_key_env: "MASS_LLM_MODEL_KEY" # Runtime credentials are stored encrypted per space.
secrets:
  master_key_env: "MASS_MASTER_KEY"
runtime:
  max_concurrent_runs: 4
  workspace_temp_root: "/tmp/mass-workspaces"
  snapshot_timeout: "60s"
tools:
  code:
    timeout: "5s"
    max_concurrent: 1
    max_source_bytes: 65536
    max_input_bytes: 2097152
    max_output_bytes: 2097152
    max_log_bytes: 65536
    max_file_operations: 100
    max_network_requests: 10
    max_network_body_bytes: 2097152
