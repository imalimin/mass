            - 'null'
    ModelPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Model'
        next_cursor:
          type:
            - string
            - 'null'
    ModelUpdate:
      type: object
