            $ref: '#/components/schemas/ShortResourceID'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ResourceID'
        - name: path
          in: query
          description: Resource path relative to the Skill root.
          schema:
            type: string
      responses:
        '200':
          description: >-
            Verified immutable bytes; unreferenced or uploading objects are not downloadable. Authorization is rechecked
            during streaming.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          description: >-
            400 invalid cursor/schema, 401 unauthenticated, 403 forbidden, 404 missing or unreferenced, 503
            integrity/storage failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
