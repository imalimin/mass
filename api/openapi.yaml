      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_.-]{2,63}$
        password:
          type: string
          format: password
          maxLength: 72
    SpaceInput:
      type: object
      additionalProperties: false
      required:
        - name
