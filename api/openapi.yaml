        - name: token_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ResourceID'
      responses:
        '200':
          description: Plaintext value of an active space OpenAPI token for owner copy (Cache-Control no-store).
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAPITokenSecret'
        default:
