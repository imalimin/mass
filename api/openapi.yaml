        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAPITokenCreateInput'
      responses:
        '201':
          description: Created space OpenAPI token and plaintext secret (Cache-Control no-store).
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAPITokenCreated'
        default:
          description: Request rejected or dependency unavailable.
          content:
            application/json:
              schema:
