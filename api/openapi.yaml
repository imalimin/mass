      type: object
      additionalProperties: false
      required:
        - events
        - through_sequence
        - next_after
        - has_more
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/JournalEvent'
        through_sequence:
          $ref: '#/components/schemas/Sequence'
        next_after:
          $ref: '#/components/schemas/Sequence'
        has_more:
          type: boolean
    WorkspaceSnapshot:
      type: object
      additionalProperties: false
      required:
        - id
        - space_id
        - session_id
        - source_run_id
        - object_id
        - manifest_ref
        - tos_uri
        - archive_sha256
        - format_version
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        space_id:
          $ref: '#/components/schemas/ResourceID'
        session_id:
          $ref: '#/components/schemas/ResourceID'
        source_run_id:
          $ref: '#/components/schemas/ResourceID'
        base_snapshot_id:
          $ref: '#/components/schemas/ResourceID'
        object_id:
          $ref: '#/components/schemas/ResourceID'
        manifest_ref:
          $ref: '#/components/schemas/ResourceID'
        tos_uri:
          type: string
          pattern: ^tos://
        archive_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        format_version:
          type: integer
          const: 1
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        $ref: '#/components/schemas/PageCursor'
    After:
      name: after
      in: query
      schema:
        $ref: '#/components/schemas/Sequence'
      description: Run UI sequence; if Last-Event-ID is also supplied they must be equal.
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: mass_session
