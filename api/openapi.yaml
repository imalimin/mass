  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        $ref: '#/components/schemas/PageCursor'
    After:
      name: after
      in: query
      schema:
        $ref: '#/components/schemas/Sequence'
      description: Run UI sequence; if Last-Event-ID is also supplied they must be equal.
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: mass_session
    BearerAuth:
      type: http
      scheme: bearer
