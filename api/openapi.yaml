          description: Token revoked (idempotent for already revoked tokens).
        default:
          description: Request rejected or dependency unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/spaces/{space_id}/openapi/tokens/{token_id}/renew:
