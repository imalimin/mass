  /api/v1/spaces/{space_id}/sessions/{session_id}/journal:
    get:
      operationId: readJournal
      security:
        - SessionCookie: []
      parameters:
        - name: space_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ShortResourceID'
        - name: session_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ShortResourceID'
        - name: after_sequence
          in: query
          schema:
            $ref: '#/components/schemas/Sequence'
          description: Exclusive Session journal position; defaults to 0. Not an AG-UI cursor.
        - name: through_sequence
          in: query
          schema:
            $ref: '#/components/schemas/Sequence'
          description: Fixed inclusive Session boundary returned by the first page. Reuse on all following pages.
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Authorized committed data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalPage'
        default:
          description: >-
            400 invalid cursor/schema, 401 unauthenticated, 403 forbidden, 404 missing or unreferenced, 503
