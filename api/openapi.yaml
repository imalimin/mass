openapi: 3.1.0
info:
  title: MASS API
  version: 0.3.0
  description: D03 immutable Agent and Skill definitions, version publishing and debug snapshots over D01/D02 foundations.
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: Process is serving HTTP.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: alive
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: >-
            MariaDB schema and TOS HeadBucket checks passed. Result cached for at most five seconds; write/read smoke is
            a separate acceptance check.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ready
        '503':
          description: Database/schema/TOS unavailable; D02 management routes remain independently authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/system:
    get:
      operationId: getSystem
      responses:
        '200':
          description: Non-secret application build metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            type: string
            format: uri
          description: Must exactly match configured public origin; JSON Content-Type is required, including logout and delete.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: >-
            400 invalid request/capability, 401 unauthenticated, 403 forbidden, 404 not found, 409 conflict, 415 content
            type, 429 login throttled or 500 storage failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
  /api/v1/auth/me:
