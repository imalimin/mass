components:
  schemas:
    AgentVisibility:
      type: string
      enum: [space, public]
    Definition:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - name
        - archived
        - default_version_id
      properties:
        id:
          $ref: '#/components/schemas/DefinitionID'
        kind:
          type: string
          enum:
            - agent
            - skill
        name:
          type: string
        archived:
          type: boolean
        default_version_id:
          type: string
        visibility:
          $ref: '#/components/schemas/AgentVisibility'
        latest_version:
          type: string
          description: Label of the latest non-archived formal version, when available in the definition list.
        updated_at:
          type: string
          format: date-time
          description: Most recent recorded definition change, when available in the definition list.
        description:
          type: string
          description: Optional Skill description extracted from SKILL.md frontmatter when include_description=true.
    DefinitionAsset:
      type: object
      additionalProperties: false
      required:
        - path
        - object_id
        - sha256
        - size
        - media_type
      properties:
        path:
          type: string
        object_id:
          type: string
          format: uuid
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        size:
          type: integer
          minimum: 0
          maximum: 8388608
        media_type:
          type: string
        package:
          type: boolean
          description: When true, object_id points to the Skill package and path identifies the file.
    DefinitionDocument:
      type: object
      additionalProperties: false
      required:
        - markdown
        - config_yaml
      properties:
        markdown:
          type: string
          maxLength: 262144
        config_yaml:
          type: string
          maxLength: 65536
        assets:
          description: Resources belonging to a Skill. Omitted for Agents.
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/DefinitionAsset'
        directories:
          description: Explicit directories relative to the Skill root. Parent paths are implied.
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            maxLength: 512
    DefinitionDraft:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - name
        - archived
        - default_version_id
        - revision
        - document
      properties:
        id:
          $ref: '#/components/schemas/DefinitionID'
        kind:
          type: string
          enum:
            - agent
            - skill
        name:
          type: string
        archived:
          type: boolean
        default_version_id:
          type: string
        revision:
          type: integer
          minimum: 1
        document:
          $ref: '#/components/schemas/DefinitionDocument'
        visibility:
          $ref: '#/components/schemas/AgentVisibility'
    DefinitionConfig:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - name
        - model
        - skills
        - tools
        - context
        - limits
      properties:
        schema_version:
          const: 1
          type: integer
        name:
          type: string
        model:
          type: string
          format: uuid
        skills:
          type:
            - array
            - 'null'
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - version
            properties:
              id:
                type: string
                format: uuid
              version:
                type: string
        tools:
          type:
            - array
            - 'null'
          items:
            type: string
        context:
          type: object
          additionalProperties: false
          required:
            - max_input_tokens
            - compression
          properties:
            max_input_tokens:
              type: integer
            max_tokens:
              type: integer
              description: Defaults to 32000 when omitted.
            compression:
              type: string
              enum:
                - summary
                - reject
        limits:
          type: object
          additionalProperties: false
          required:
            - max_steps
            - timeout_seconds
          properties:
            max_steps:
              type: integer
            timeout_seconds:
              type: integer
    SkillBinding:
      type: object
      additionalProperties: false
      required:
        - skill_id
        - version_id
        - version
        - sha256
      properties:
        skill_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        version:
          type: string
        sha256:
          type: string
    DefinitionBundle:
      type: object
      additionalProperties: false
      required:
        - format_version
        - definition_id
        - kind
        - name
        - revision
        - document
        - config
        - model
        - bindings
      properties:
        format_version:
          const: 1
          type: integer
        definition_id:
          $ref: '#/components/schemas/DefinitionID'
        kind:
          type: string
          enum:
            - agent
            - skill
        name:
          type: string
        revision:
          type: integer
        document:
          $ref: '#/components/schemas/DefinitionDocument'
        config:
          anyOf:
            - $ref: '#/components/schemas/DefinitionConfig'
            - type: 'null'
        model:
          anyOf:
            - $ref: '#/components/schemas/Model'
            - type: 'null'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/SkillBinding'
    DefinitionVersion:
      type: object
      additionalProperties: false
      required:
        - id
        - definition_id
        - label
        - debug
        - archived
        - content_id
        - sha256
        - created_at
        - bundle
      properties:
        id:
          type: string
          format: uuid
        definition_id:
          $ref: '#/components/schemas/DefinitionID'
        label:
          type: string
        debug:
          type: boolean
        archived:
          type: boolean
        content_id:
          type: string
          format: uuid
        sha256:
          type: string
        created_at:
          type: string
          format: date-time
        bundle:
          $ref: '#/components/schemas/DefinitionBundle'
    DefinitionReference:
      type: object
      additionalProperties: false
      required:
        - id
        - definition_id
        - name
        - label
        - debug
      properties:
        id:
          type: string
          format: uuid
        definition_id:
          $ref: '#/components/schemas/ShortResourceID'
        name:
          type: string
        label:
          type: string
        debug:
          type: boolean
    DefinitionDiff:
      type: object
      additionalProperties: false
      required:
        - from
        - to
      properties:
        from:
          $ref: '#/components/schemas/DefinitionVersion'
        to:
          $ref: '#/components/schemas/DefinitionVersion'
    DefinitionNameInput:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,63}$
    DefinitionDraftInput:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - document
      properties:
        expected_revision:
          type: integer
          minimum: 1
        document:
          $ref: '#/components/schemas/DefinitionDocument'
    DefinitionUploadInput:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - path
        - media_type
        - data_base64
      properties:
        expected_revision:
          type: integer
          minimum: 1
        path:
          type: string
          description: Resource path relative to the Skill root.
        media_type:
          type: string
        data_base64:
          type: string
          contentEncoding: base64
          maxLength: 11184812
    DefinitionPublishInput:
      type: object
      additionalProperties: false
      required:
        - expected_revision
      properties:
        expected_revision:
          type: integer
          minimum: 1
        label:
          type: string
          maxLength: 64
          description: Omit to assign the next vN for this definition, starting at v1. Debug snapshots do not have a label.
    DefinitionArchiveInput:
      type: object
      additionalProperties: false
      required:
        - archived
      properties:
        archived:
          type: boolean
    DefinitionDefaultInput:
      type: object
      additionalProperties: false
      required:
        - version_id
      properties:
        version_id:
          type: string
          format: uuid
    DefinitionPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Definition'
        next_cursor:
          type:
            - string
            - 'null'
    DefinitionVersionPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DefinitionVersion'
        next_cursor:
          type:
            - string
            - 'null'
    DefinitionReferencePage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DefinitionReference'
        next_cursor:
          type:
            - string
            - 'null'
    SystemInfo:
      type: object
      additionalProperties: false
      required:
        - name
        - version
        - stage
        - protocol_profile
      properties:
        name:
          type: string
          const: MASS
        version:
          type: string
        stage:
          type: string
          enum:
            - D00
            - D02
            - D03
            - D04
            - D05
            - D06
            - D08
        protocol_profile:
          type: string
          const: mass-agui-v1
    Error:
      type: object
      required:
        - code
        - message
        - request_id
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        message:
          type: string
        request_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        details:
          type: object
          additionalProperties: true
    ShortResourceID:
      type: string
      pattern: ^[a-z2-7]{16}$
      description: Server-generated space, Agent, or session ID.
    DefinitionID:
      anyOf:
        - $ref: '#/components/schemas/ShortResourceID'
        - $ref: '#/components/schemas/ResourceID'
      description: Agent definitions use short IDs and Skill definitions use UUIDs.
    ResourceID:
      type: string
      format: uuid
      description: Server-generated UUID; opaque to callers, case-sensitive in storage.
    Sequence:
      type: string
      pattern: ^(0|[1-9][0-9]{0,18})$
      description: Canonical decimal string in 0..9223372036854775807. Journal and UI sequences are distinct domains.
    PageCursor:
      type: string
      maxLength: 1024
      description: >-
        Authenticated keyset cursor bound to the current actor, space and query. D02 management lists are live views;
        refresh to see entries inserted before the cursor.
    PageInfo:
      type: object
      required:
        - next_cursor
      properties:
        next_cursor:
          type:
            - string
            - 'null'
          maxLength: 1024
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9._:-]+$
      description: Scoped to space, actor and operation. Same key/content returns the previous result; changed content is 409.
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - username
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        username:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_.-]{2,63}$
    Space:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - is_owner
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/ShortResourceID'
        name:
          type: string
          minLength: 1
          maxLength: 100
        is_owner:
          type: boolean
        created_at:
          type: string
          format: date-time
    Member:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - is_owner
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        username:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_.-]{2,63}$
        is_owner:
          type: boolean
    LoginInput:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_.-]{2,63}$
        password:
          type: string
          format: password
          maxLength: 72
    SpaceInput:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    MemberInput:
      type: object
      additionalProperties: false
      required:
        - username
      properties:
        username:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_.-]{2,63}$
    Model:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - provider
        - model_id
        - base_url
        - context_window
        - max_output_tokens
        - temperature
        - enabled
        - revision
      properties:
        id:
          $ref: '#/components/schemas/ResourceID'
        name:
          type: string
          minLength: 1
          maxLength: 100
        provider:
          type: string
          const: ark
        model_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        base_url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
        context_window:
          type: integer
          minimum: 2
          maximum: 2000000
        max_output_tokens:
          type: integer
          minimum: 1
          maximum: 1000000
        temperature:
          type: number
          minimum: 0
          maximum: 2
        enabled:
          type: boolean
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    RevisionInput:
      type: object
      additionalProperties: false
      required:
        - revision
      properties:
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    ModelCapabilities:
      type: object
      additionalProperties: false
      required:
        - provider
        - input_types
        - streaming
        - tool_calling
      properties:
        provider:
          type: string
          const: ark
        input_types:
          type: array
          items:
            type: string
            const: text
        streaming:
          type: boolean
          const: true
        tool_calling:
          type: boolean
          const: true
    ModelInput:
      type: object
      additionalProperties: false
      required:
        - name
        - provider
        - model_id
        - base_url
        - api_key
        - context_window
        - max_output_tokens
        - temperature
        - enabled
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        provider:
          type: string
          const: ark
        model_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        base_url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
        api_key:
          type: string
          format: password
          writeOnly: true
          maxLength: 8192
          description: Required on creation; omitted or empty on update retains the stored key.
        context_window:
          type: integer
          minimum: 2
          maximum: 2000000
        max_output_tokens:
          type: integer
          minimum: 1
          maximum: 1000000
        temperature:
          type: number
          minimum: 0
          maximum: 2
        enabled:
          type: boolean
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    SpacePage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Space'
        next_cursor:
          type:
            - string
            - 'null'
    MemberPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        next_cursor:
          type:
